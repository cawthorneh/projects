# Fetch LCRA server-side and commit a parsed snapshot.
#
# The browser can't read LCRA directly (no CORS) and all three public relays
# the components used are dead. A server can read it fine — the probe showed
# it returns HTTP 200 to a runner — so the fetch happens here and the site
# reads a static JSON instead of depending on somebody else's proxy.
name: Cache LCRA rainfall

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes
  workflow_dispatch:
  push:
    branches: [claude/rainfall-dashboard-dripping-yz5fus]
    paths:
      - scripts/build-rainfall-json.mjs
      - .github/workflows/rainfall-cache.yml

permissions:
  contents: write

concurrency:
  group: rainfall-cache
  cancel-in-progress: false

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and parse
        run: node scripts/build-rainfall-json.mjs

      - name: Commit if the readings changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first. `git diff` ignores untracked files, so on the very
          # first run — when the file is new — it reports no change and the
          # snapshot is never committed at all.
          git add -f docs/data/rainfall.json
          if git diff --cached --quiet -- docs/data/rainfall.json; then
            echo "identical to the committed copy"; exit 0
          fi

          # `generated` moves every run, so compare only the readings —
          # otherwise this commits every half hour whether it rained or not.
          before=$(git show HEAD:docs/data/rainfall.json 2>/dev/null | jq -Sc '.locations' 2>/dev/null || echo none)
          after=$(jq -Sc '.locations' docs/data/rainfall.json)
          if [ "$before" = "$after" ]; then
            echo "only the timestamp moved — not committing"
            git reset -q HEAD -- docs/data/rainfall.json
            exit 0
          fi

          git commit -m "Update cached LCRA rainfall [skip ci]"
          git push

      - name: Readings in this snapshot
        if: always()
        run: |
          echo "generated: $(jq -r .generated docs/data/rainfall.json)"
          echo "columns:   $(jq -c .columns docs/data/rainfall.json)"
          echo "dated:     $(jq -c .debug.datedColumns docs/data/rainfall.json)"
          echo
          jq -r '.locations[] | "  \(.label)|\(.total48)|\(.today)|\(.yesterday)|\(.h24)|\(.matched)|\([.gauges[].name] | join(", "))"' \
            docs/data/rainfall.json | column -t -s'|'
