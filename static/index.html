<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCRA Rainfall Dashboard</title>
  <style>
    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #20243a;
      --border:   #2a2d3a;
      --accent:   #3b9ede;
      --green:    #2ec4b6;
      --yellow:   #f5c542;
      --red:      #e05050;
      --text:     #e8eaf0;
      --muted:    #8b8fa8;
      --bar-bg:   #232636;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .logo { display: flex; align-items: center; gap: .75rem; }
    h1 { font-size: 1.15rem; font-weight: 700; }
    h1 span { color: var(--accent); }
    .subtitle { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .meta { font-size: .78rem; color: var(--muted); text-align: right; line-height: 1.6; }
    .meta b { color: var(--text); }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
           background: var(--green); margin-right: 4px; vertical-align: middle; }
    .dot.err { background: var(--red); }

    /* ── Main layout ── */
    main { padding: 1.75rem 2rem; max-width: 1400px; margin: 0 auto; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab {
      padding: .4rem 1rem; border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--muted);
      font-size: .82rem; cursor: pointer; transition: all .15s;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    /* ── Error banner ── */
    .err-banner {
      background: #2a1010; border: 1px solid #7a2020;
      border-radius: 8px; padding: .9rem 1.1rem;
      color: #e07070; font-size: .85rem;
      margin-bottom: 1.25rem; line-height: 1.55;
    }
    .err-banner code {
      background: #3a1515; padding: .1rem .4rem;
      border-radius: 4px; font-size: .82rem;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.1rem;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
      display: flex; flex-direction: column;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)22; }

    .card-head {
      padding: .9rem 1.15rem .7rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .loc-name { font-size: .98rem; font-weight: 700; }
    .station-badge {
      font-size: .7rem; color: var(--muted);
      background: var(--bar-bg); padding: .18rem .5rem;
      border-radius: 999px;
    }

    /* ── Period rows ── */
    .periods { padding: .9rem 1.15rem; display: flex; flex-direction: column; gap: .7rem; flex: 1; }
    .p-row { display: flex; flex-direction: column; gap: .28rem; }
    .p-meta { display: flex; justify-content: space-between; align-items: baseline; }
    .p-label { font-size: .78rem; color: var(--muted); }
    .p-val { font-size: .92rem; font-weight: 700; }
    .p-val.zero { color: var(--muted); }
    .bar { height: 5px; background: var(--bar-bg); border-radius: 999px; overflow: hidden; margin-top: 1px; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width .6s ease; min-width: 2px; }
    .bar-fill.a { background: var(--accent); }
    .bar-fill.g { background: var(--green); }
    .bar-fill.y { background: var(--yellow); }
    .bar-fill.r { background: var(--red); }

    .no-data { padding: .7rem 1.15rem; font-size: .82rem; color: var(--muted); font-style: italic; }

    /* ── Summary strip ── */
    .strip {
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border); background: var(--surface2);
    }
    .strip-cell { padding: .6rem .8rem; text-align: center; }
    .strip-cell + .strip-cell { border-left: 1px solid var(--border); }
    .s-lbl { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
    .s-val { font-size: 1.05rem; font-weight: 800; }
    .s-val.blue   { color: var(--accent); }
    .s-val.green  { color: var(--green); }
    .s-val.dim    { color: var(--muted); font-weight: 400; }

    /* ── Spinner ── */
    .spinner { text-align: center; padding: 4rem; color: var(--muted); font-size: .9rem; }
    .spinner::before {
      content: ""; display: block; width: 32px; height: 32px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer {
      text-align: center; padding: 1.75rem 2rem;
      color: var(--muted); font-size: .78rem;
    }
    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 600px) {
      main { padding: 1rem; }
      .grid { grid-template-columns: 1fr; }
      header { padding: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <!-- Raindrop SVG icon -->
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M15 3 C15 3 6 14 6 19 a9 9 0 0 0 18 0 C24 14 15 3 15 3Z" fill="#3b9ede" opacity=".85"/>
      <path d="M11 21 a5 5 0 0 0 7 0" stroke="#fff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity=".6"/>
    </svg>
    <div>
      <h1>LCRA <span>Rainfall</span> Dashboard</h1>
      <div class="subtitle">Lower Colorado River Basin · Texas Hill Country</div>
    </div>
  </div>
  <div class="meta" id="metaBox">Connecting…</div>
</header>

<main>
  <div id="errBox" style="display:none" class="err-banner"></div>

  <div class="tabs" id="tabs">
    <button class="tab" data-view="five_day">3 Most Recent Days</button>
    <button class="tab" data-view="current">Intraday Periods</button>
    <button class="tab" data-view="monthly">Monthly / YTD</button>
  </div>

  <div id="grid" class="grid">
    <div class="spinner">Fetching live rainfall data…</div>
  </div>
</main>

<footer>
  Data: <a href="https://hydromet.lcra.org/" target="_blank" rel="noopener">LCRA HydroMet</a>
  · Refreshes every 10 min · All values in inches
</footer>

<script>
"use strict";

let _data   = null;
let _view   = "five_day";   // default: 3 most recent days
const REFRESH_MS = 10 * 60 * 1000;

// Max inches used to scale bar widths per view
const BAR_MAX = { five_day: 4, current: 3, monthly: 20 };

function barClass(in_, max) {
  const p = in_ / max;
  if (p >= 0.7) return "r";
  if (p >= 0.35) return "y";
  return "g";
}

function fmtIn(v) {
  if (v == null || isNaN(v)) return "—";
  return parseFloat(v).toFixed(2) + '"';
}

function periodRows(periods) {
  const entries = Object.entries(periods || {});
  if (!entries.length) return '<div class="no-data">No matching stations found</div>';

  const max = BAR_MAX[_view] ?? 4;
  // For five_day view only show 3 most recent
  const visible = _view === "five_day" ? entries.slice(0, 3) : entries;

  return visible.map(([label, val]) => {
    const in_ = parseFloat(val) || 0;
    const pct  = Math.min(100, (in_ / max) * 100);
    const cls  = barClass(in_, max);
    const zero = in_ === 0 ? " zero" : "";
    return `
      <div class="p-row">
        <div class="p-meta">
          <span class="p-label">${label}</span>
          <span class="p-val${zero}">${fmtIn(in_)}</span>
        </div>
        <div class="bar"><div class="bar-fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div>
      </div>`;
  }).join("");
}

function summaryFor(loc) {
  const cur = loc.current  || {};
  const fd  = loc.five_day || {};
  const mon = loc.monthly  || {};

  // Today: prefer midnight-to-now, then Since midnight, then Today from five_day
  const today = cur["Since midnight"] ?? cur["Previous 24 hours"] ?? fd["Today"] ?? null;

  // 5-day total or sum of available days
  const fiveTot = fd["5-Day Total"] ?? (() => {
    const days = ["Today","Yesterday","2 Days Ago","3 Days Ago","4 Days Ago"];
    const vals = days.map(k => parseFloat(fd[k]) || 0);
    return vals.some(v => v > 0) ? vals.reduce((a,b)=>a+b, 0) : null;
  })();

  const month = mon["This Month"] ?? mon["30-Day Total"] ?? null;
  return { today, fiveTot, month };
}

function renderCard(loc) {
  const view  = loc[_view] || {};
  const { today, fiveTot, month } = summaryFor(loc);

  const badgeHtml = loc.stations > 0
    ? `<span class="station-badge">${loc.stations} gauge${loc.stations > 1 ? "s" : ""}</span>`
    : "";

  const todayClass  = today   == null ? "dim" : "blue";
  const fiveClass   = fiveTot == null ? "dim" : "green";
  const monthClass  = month   == null ? "dim" : "blue";

  return `
    <div class="card">
      <div class="card-head">
        <span class="loc-name">${loc.label}</span>
        ${badgeHtml}
      </div>
      <div class="periods">${periodRows(view)}</div>
      <div class="strip">
        <div class="strip-cell">
          <div class="s-lbl">Today</div>
          <div class="s-val ${todayClass}">${fmtIn(today)}</div>
        </div>
        <div class="strip-cell">
          <div class="s-lbl">5-Day</div>
          <div class="s-val ${fiveClass}">${fmtIn(fiveTot)}</div>
        </div>
        <div class="strip-cell">
          <div class="s-lbl">Month</div>
          <div class="s-val ${monthClass}">${fmtIn(month)}</div>
        </div>
      </div>
    </div>`;
}

function setActiveTab(view) {
  _view = view;
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.view === view);
  });
}

function render() {
  if (!_data) return;
  document.getElementById("grid").innerHTML = _data.locations.map(renderCard).join("");
}

async function load() {
  try {
    const resp = await fetch("/api/rainfall");
    const json = await resp.json();

    if (!resp.ok) {
      throw new Error(json.detail || resp.statusText);
    }

    _data = json;
    document.getElementById("errBox").style.display = "none";
    document.getElementById("metaBox").innerHTML =
      `<span class="dot"></span><b>Live</b><br>Updated ${_data.last_updated}`;
    render();
  } catch (e) {
    const box = document.getElementById("errBox");
    box.style.display = "";
    box.innerHTML = `
      <strong>Could not fetch LCRA data.</strong><br>
      ${e.message}<br><br>
      LCRA HydroMet blocks requests from cloud &amp; server IP ranges (Cloudflare protection).<br>
      <strong>Run this app locally</strong> (from your home or office network):
      <br><code>uvicorn app:app --reload</code> then open <code>http://localhost:8000</code>
    `;
    document.getElementById("metaBox").innerHTML =
      `<span class="dot err"></span><b style="color:var(--red)">Unavailable</b>`;
    if (!_data) document.getElementById("grid").innerHTML = "";
  }
}

// Tab clicks
document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  setActiveTab(btn.dataset.view);
  render();
});

// Initialise
setActiveTab("five_day");
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
